<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		Username
		<input id='Username' type='text'>
		Password
		<input id='Password' type='text'>
		Fullname
		<input id='Fullname' type='text'>
		Idnumber
		<input id='Idnumber' type='text'>
		Course
		<input id='Course' type='text'>
		Yearlevel
		<input id='Yearlevel' type='text'>
		School
		<input id='School' type='text'>
		Nationality
		<input id='Nationality' type='text'>
		Religion
		<input id='Religion' type='text'>
		Age
		<input id='Age' type='text'>
		Location
		<input id='Location' type='text'>

		<button type="button" onclick="clickButton( document.getElementById('Username').value ,document.getElementById('Password').value ,document.getElementById('Fullname').value ,document.getElementById('Idnumber').value ,document.getElementById('Course').value ,document.getElementById('Yearlevel').value ,document.getElementById('School').value ,document.getElementById('Nationality').value ,document.getElementById('Religion').value ,document.getElementById('Age').value ,document.getElementById('Location').value)">Click Me!</button>

		<script>


		const user = 'qwer';
		const pass = '1234'


		const clickButton = (a,b,c,d,e,f,g,h,i,j,k) =>{

			const postData = {
				Username:a,
				Password:b,
				Fullname:c,
				Idnumber:d,
				Course:e,
				Yearlevel:f,
				School:g,
				Nationality:h,
				Religion:i,
				Age:j,
				Location:k

			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/ApplicantSchool',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
